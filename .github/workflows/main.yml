
name: iOS Unsigned IPA Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Git LFS 포함 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS Objects
        run: git lfs pull

      # 2. 스크립트 실행 권한
      - name: Grant Execute Permissions
        run: |
          find . -name "*.sh" -exec chmod +x {} \; || true

      # 3. Xcode 무서명 빌드
      - name: Build Unsigned App
        run: |
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            PROVISIONING_PROFILE="" \
            clean build

      # 4. IPA 패키징
      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload

          APP_PATH=$(find ./build_output/Build/Products/Release-iphoneos \
            -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi

          cp -R "$APP_PATH" Payload/

          zip -r -y app-unsigned.ipa Payload

          echo "Unsigned IPA created successfully!"

      # 5. IPA 업로드
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: app-unsigned.ipa
          retention-days: 7
