name: iOS Unsigned IPA Build

on: workflow_dispatch



jobs:

  build:

    runs-on: macos-latest

    steps:

      # 1. Git LFS 바이너리까지 온전히 체크아웃

      - uses: actions/checkout@v4

        with:

          lfs: true



      - name: Checkout LFS objects

        run: git lfs pull



      # 2. 메인 및 프레임워크 모두 서명 없이 빌드

      - name: Build Unsigned App

        run: |

          xcodebuild -project Unity-iPhone.xcodeproj \

            -scheme Unity-iPhone \

            -sdk iphoneos \

            -configuration Release \

            -derivedDataPath ./build_output \

            CODE_SIGNING_ALLOWED=NO \

            CODE_SIGNING_REQUIRED=NO \

            CODE_SIGN_IDENTITY="" \

            PROVISIONING_PROFILE_SPECIFIER="" \

            clean build



      # 3. .app을 Payload 폴더에 넣고 ipa 압축

      - name: Package to IPA

        run: |

          mkdir -p Payload

          cp -r ./build_output/Build/Products/Release-iphoneos/*.app Payload/

          zip -r app-unsigned.ipa Payload



      # 4. 결과물 업로드

      - name: Upload Artifact

        uses: actions/upload-artifact@v4

        with:

          name: ios-unsigned-ipa

          path: app-unsigned.ipaname: iOS Unsigned IPA Build

on: workflow_dispatch

jobs:

  build:

    runs-on: macos-latest

    steps:

      - uses: actions/checkout@v4

      - name: Build Unsigned App

        run: |

          xcodebuild -project Unity-iPhone.xcodeproj \

            -scheme Unity-iPhone \

            -sdk iphoneos \

            -configuration Release \

            CODE_SIGNING_ALLOWED=NO \

            CODE_SIGNING_REQUIRED=NO \

            CODE_SIGNING_IDENTITY="" \

            PROVISIONING_PROFILE_SPECIFIER="" \

            clean build

      - name: Package to IPA

        run: |

          mkdir -p Payload

          cp -r build/Release-iphoneos/build.app Payload/  # (프로젝트 구조에 맞춰 .app 경로 지정)

          zip -r app-unsigned.ipa Payload

      - name: Upload Artifact

        uses: actions/upload-artifact@v4

        with:

          name: ios-unsigned-ipa

          path: app-unsigned.ipa
